name: LearnGreek
options:
  bundleIdPrefix: com.ellinika
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16"

settings:
  base:
    DEVELOPMENT_TEAM: 5R6CF59GRY
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  LearnGreek:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: LearnGreek
    resources:
      - path: LearnGreek/Resources
      - path: LearnGreek/Assets.xcassets
    info:
      path: LearnGreek/Info.plist
      properties:
        CFBundleDisplayName: LearnGreek
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellinika.LearnGreek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LearnGreekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LearnGreekTests
    dependencies:
      - target: LearnGreek
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(SRCROOT)/LearnGreek"
        GENERATE_INFOPLIST_FILE: YES

  LearnGreekUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LearnGreekUITests
    dependencies:
      - target: LearnGreek
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LearnGreek:
    build:
      targets:
        LearnGreek: all
        LearnGreekTests: [test]
        LearnGreekUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LearnGreekTests
        - LearnGreekUITests
